<script>
'use strict';

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let W = 1280, H = 720, DPR = 1;
function resize(){
  DPR = Math.min(devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  canvas.width = Math.floor(W * DPR); canvas.height = Math.floor(H * DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.imageSmoothingEnabled = false; // Ensures crisp, pixel-perfect rendering for stylized aesthetics
}
addEventListener('resize', resize); resize();

const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const rand=(a,b)=>a+Math.random()*(b-a);
const hitRect=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
const keys={}, pressed={};
const mouse={x:0,y:0,click:false};
addEventListener('keydown', e=>{ if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code)) e.preventDefault(); if(!keys[e.code]) pressed[e.code]=true; keys[e.code]=true; });
addEventListener('keyup', e=>keys[e.code]=false);
canvas.addEventListener('mousemove', e=>{ const r=canvas.getBoundingClientRect(); mouse.x=e.clientX-r.left; mouse.y=e.clientY-r.top; });
canvas.addEventListener('mousedown', ()=>mouse.click=true);

class SoundSystem{
  constructor(){ this.ctx=null; this.master=null; this.muted=false; this.beat=0; this.timer=0; }
  start(){
    if(this.ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return;
    this.ctx = new AC(); this.master=this.ctx.createGain(); this.master.gain.value=this.muted?0:0.35; this.master.connect(this.ctx.destination);
  }
  toggle(){ this.muted=!this.muted; if(this.master) this.master.gain.value=this.muted?0:0.35; }
  tone(f=440,d=.1,type='sine',vol=.15,slide=0){
    this.start(); if(!this.ctx||this.muted) return;
    const t=this.ctx.currentTime, o=this.ctx.createOscillator(), g=this.ctx.createGain();
    o.type=type; o.frequency.setValueAtTime(f,t); if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(20,f+slide),t+d);
    g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.001,t+d);
    o.connect(g); g.connect(this.master); o.start(t); o.stop(t+d+.02);
  }
  noise(d=.08,vol=.12,filter=900){
    this.start(); if(!this.ctx||this.muted) return;
    const n=Math.floor(this.ctx.sampleRate*d), b=this.ctx.createBuffer(1,n,this.ctx.sampleRate), data=b.getChannelData(0);
    for(let i=0;i<n;i++) data[i]=(Math.random()*2-1)*(1-i/n);
    const s=this.ctx.createBufferSource(), f=this.ctx.createBiquadFilter(), g=this.ctx.createGain();
    s.buffer=b; f.type='bandpass'; f.frequency.value=filter; g.gain.value=vol;
    s.connect(f); f.connect(g); g.connect(this.master); s.start();
  }
  play(name){
    if(name==='select') this.tone(520,.06,'triangle',.14,120);
    if(name==='jump') this.tone(320,.10,'square',.12,220);
    if(name==='dash') this.noise(.05,.07,450);
    if(name==='hit'){ this.tone(170,.08,'sawtooth',.22,-50); this.noise(.08,.12,1300); }
    if(name==='heavy'){ this.tone(85,.18,'sawtooth',.32,-35); this.noise(.15,.18,650); }
    if(name==='special') this.tone(760,.12,'triangle',.16,-240);
    if(name==='ko'){ this.tone(100,.25,'sawtooth',.35,-55); this.noise(.25,.2,240); }
    if(name==='victory'){ this.tone(330,.12,'triangle',.18); setTimeout(()=>this.tone(440,.12,'triangle',.18),120); setTimeout(()=>this.tone(660,.28,'triangle',.2),240); }
    if(name==='shield') this.tone(690,.08,'sine',.14,-150);
  }
  update(dt){
    this.start(); if(!this.ctx||this.muted) return;
    this.timer-=dt;
    if(this.timer<=0){
      this.timer+=.285;
      const notes=[196,247,294,330,392,330,294,247,220,277,330,370,440,370,330,277];
      this.tone(notes[this.beat++%notes.length],.16,this.beat%4?'triangle':'square',this.beat%4?.028:.052,0);
    }
  }
}
const audio = new SoundSystem();

const characters = [
  {id:'auron', name:'Auron Vale', role:'Balanced', color:'#45e5ff', dark:'#123e74', accent:'#fff06d', speed:380, air:740, weight:1, jump:660, fall:1450, scale:1, recover:{lift:770, drift:1.0}, desc:'All-rounder. Strong vertical Up-B with steady air drift.'},
  {id:'bront', name:'Bront Keggar', role:'Heavy', color:'#ff8848', dark:'#6b2515', accent:'#ffd56d', speed:300, air:600, weight:1.38, jump:600, fall:1520, scale:1.15, recover:{lift:880, drift:0.5}, desc:'Bruiser. Explosive vertical Up-B but poor horizontal recovery.'},
  {id:'lyra', name:'Lyra Flick', role:'Fast', color:'#b35cff', dark:'#33145f', accent:'#74ffbd', speed:455, air:905, weight:.86, jump:700, fall:1385, scale:.9, recover:{lift:740, drift:1.7}, desc:'Speed skater. Best air control and the widest Up-B recovery.'},
  {id:'sable', name:'Sable Orbit', role:'Ranged', color:'#63ffda', dark:'#103f46', accent:'#ffea6b', speed:350, air:730, weight:.96, jump:640, fall:1420, scale:1, ranged:true, recover:{lift:360, drift:1.0, warp:390}, desc:'Caster. Projectile zoning and a teleport blink Up-B recovery.'}
];
const moveNames = {
  jab:['Pulse Jab','Anvil Tap','Pixel Poke','Scope Tap'], ftilt:['Comet Cut','Forge Hook','Ribbon Swipe','Prism Staff'], utilt:['Sky Needle','Chimney Punch','Flip Spark','Orbit Rod'], dtilt:['Low Sweep','Quake Boot','Skim Kick','Low Signal'],
  nair:['Orbit Flash','Iron Spin','Glow Wheel','Halo Pulse'], fair:['Forward Glint','Meteor Elbow','Needle Heel','Lens Swipe'], uair:['Rising Arc','Smokestack','Neon Snip','Beacon Tap'], dair:['Star Drop','Falling Keg','Heel Drill','Falling Comet'],
  nspec:['Light Burst','Boiler Burst','Afterimage Pop','Orbit Bolt'], sspec:['Nova Step','Coal Rush','Flash Slide','Vector Dash'], uspec:['Moonlift','Steam Cannon','Ribbon Rocket','Signal Lift'], dspec:['Ground Flare','Foundry Slam','Pulse Feint','Gravity Pin']
};
function makeMoves(char,i){
  const heavy=i===1, fast=i===2, ranged=i===3;
  const mul=heavy?1.32:fast?.82:ranged?.9:1;
  const quick=fast?.68:heavy?1.35:1;
  const mk=(kind,base,kb,ang,w,h,ox,oy,opts={})=>({kind,name:moveNames[kind][i],startup:base.s*quick,active:base.a,recovery:base.r*quick,damage:Math.round(base.d*mul),kb:kb*(heavy?1.18:fast?.9:ranged?.95:1),angle:ang,w:w*(char.scale),h:h*(char.scale),ox,oy,color:opts.color||char.accent,...opts});
  return {
    jab:mk('jab',{s:.055,a:.075,r:.14,d:5},310,-.2,54,34,32,-38,{color:char.color}),
    ftilt:mk('ftilt',{s:.10,a:.11,r:.24,d:8},480,-.14,82,42,42,-44,{color:char.accent}),
    utilt:mk('utilt',{s:.095,a:.11,r:.22,d:8},470,-1.35,58,78,-29,-96,{color:char.accent}),
    dtilt:mk('dtilt',{s:.075,a:.10,r:.19,d:7},390,.05,78,25,36,-18,{color:char.color}),
    nair:mk('nair',{s:.07,a:.16,r:.24,d:7},410,-.7,78,62,-39,-63,{color:char.color}),
    fair:mk('fair',{s:.095,a:.12,r:.26,d:8},510,-.32,84,44,42,-50,{color:char.accent}),
    uair:mk('uair',{s:.08,a:.12,r:.22,d:7},430,-1.45,58,80,-29,-102,{color:char.accent}),
    dair:mk('dair',{s:.13,a:.13,r:.33,d:10},540,1.16,56,72,-28,-12,{color:char.color}),
    nspec:mk('nspec',{s:.13,a:.10,r:.32,d:11},610,-.22,90,56,42,-55,{special:true,color:char.accent,projectile:ranged}),
    sspec:mk('sspec',{s:.08,a:.16,r:.35,d:10},560,-.12,76,48,38,-48,{special:true,dash:heavy?420:fast?650:510,color:char.color}),
    uspec:mk('uspec',{s:.055,a:.17,r:.42,d:8},490,-1.25,58,88,-29,-105,{special:true,lift:char.recover.lift,warp:char.recover.warp,drift:char.recover.drift,color:char.accent}),
    dspec:mk('dspec',{s:.14,a:.13,r:.38,d:12},650,-.85,90,40,-45,-20,{special:true,color:char.accent})
  };
}
characters.forEach((c,i)=>c.moves=makeMoves(c,i));

const stages = [
  {name:'Skyforge Flats', accent:'#7ee8ff', bg:['#0a0f25','#1b2a59'], bounds:{l:-1120,r:1120,t:-800,b:640}, platforms:[{x:-430,y:210,w:860,h:42,main:true},{x:-330,y:45,w:230,h:24},{x:100,y:45,w:230,h:24},{x:-110,y:-115,w:220,h:22}], desc:'Classic center stage with three floating platforms.'},
  {name:'Neon Rooftop', accent:'#ff55df', bg:['#05020f','#140833'], bounds:{l:-1180,r:1180,t:-830,b:660}, platforms:[{x:-470,y:230,w:940,h:44,main:true},{x:-525,y:60,w:260,h:24},{x:265,y:20,w:260,h:24},{x:-120,y:-140,w:240,h:22}], desc:'City skyline, glowing towers, and clean ledges.'},
  {name:'Mossgate Ruins', accent:'#b1ff67', bg:['#030a06','#102616'], bounds:{l:-1150,r:1150,t:-820,b:660}, platforms:[{x:-480,y:245,w:960,h:46,main:true},{x:-465,y:70,w:285,h:25},{x:160,y:105,w:300,h:25},{x:-105,y:-100,w:220,h:22},{x:-20,y:250,w:200,h:22}], desc:'Uneven forest ruins with drifting spores.'}
];

class Particle{
  constructor(x,y,vx,vy,life,size,color,type='circle'){ Object.assign(this,{x,y,vx,vy,life,max:life,size,color,type,rot:rand(0,6.28),spin:rand(-8,8)}); }
  update(dt){ this.life-=dt; this.x+=this.vx*dt; this.y+=this.vy*dt; this.vy+=260*dt; this.rot+=this.spin*dt; }
  draw(c){
    c.save(); c.globalAlpha=clamp(this.life/this.max,0,1); c.translate(this.x,this.y); c.rotate(this.rot); c.fillStyle=this.color; c.strokeStyle=this.color;
    if(this.type==='spark') c.fillRect(-this.size*2,-this.size*.2,this.size*4,this.size*.4);
    else if(this.type==='ring'){ c.lineWidth=3; c.beginPath(); c.arc(0,0,this.size*(1.25-this.life/this.max),0,6.28); c.stroke(); }
    else { c.beginPath(); c.arc(0,0,this.size,0,6.28); c.fill(); }
    c.restore();
  }
}
class Projectile{
  constructor(owner,x,y,vx,vy,color){ Object.assign(this,{owner,x,y,vx,vy,color,r:13,life:1.5,damage:8,kb:520,hit:false}); }
  update(dt,g){
    this.life-=dt; this.x+=this.vx*dt; this.y+=this.vy*dt; this.vy+=35*dt;
    for(const p of g.players){
      if(p===this.owner||p.dead||p.invincible>0) continue;
      const hb=p.hurtbox(), cx=clamp(this.x,hb.x,hb.x+hb.w), cy=clamp(this.y,hb.y,hb.y+hb.h);
      if((this.x-cx)**2+(this.y-cy)**2<this.r*this.r){ this.hit=true; p.takeHit(this.owner,this.damage,this.kb,Math.atan2(this.vy,this.vx),g,true); }
    }
  }
  draw(c){ c.save(); c.globalCompositeOperation='lighter'; c.shadowBlur=18; c.shadowColor=this.color; c.fillStyle=this.color; c.beginPath(); c.arc(this.x,this.y,this.r,0,6.28); c.fill(); c.globalAlpha=.35; c.beginPath(); c.arc(this.x-this.vx*.03,this.y-this.vy*.03,this.r*1.5,0,6.28); c.fill(); c.restore(); }
}

function roundRect(c,x,y,w,h,r,fill=true,stroke=false){
  r=Math.min(r,w/2,h/2); c.beginPath(); c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r); c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath(); if(fill)c.fill(); if(stroke)c.stroke();
}
function drawTrashCan(c, cx, cy, s, t){
  c.save(); c.translate(cx, cy + Math.sin((t||0)*2)*4*s); c.scale(s,s); c.lineJoin='round';
  const topW=90, botW=68, h=104, ty=-h/2;
  // body
  c.shadowBlur=28; c.shadowColor='#3bd66b';
  const g=c.createLinearGradient(0,ty,0,ty+h);
  g.addColorStop(0,'#aebfc8'); g.addColorStop(.5,'#5d6f78'); g.addColorStop(1,'#36444b');
  c.fillStyle=g;
  c.beginPath(); c.moveTo(-topW/2,ty+16); c.lineTo(topW/2,ty+16); c.lineTo(botW/2,ty+h); c.lineTo(-botW/2,ty+h); c.closePath(); c.fill();
  c.shadowBlur=0;
  // vertical ribs
  c.strokeStyle='rgba(18,26,30,.5)'; c.lineWidth=3;
  for(let i=-2;i<=2;i++){ c.beginPath(); c.moveTo(i*16, ty+22); c.lineTo(i*12, ty+h-5); c.stroke(); }
  // lid
  c.fillStyle='#74848c'; roundRect(c,-topW/2-7,ty,topW+14,17,7,true,false);
  c.fillStyle='#b3c1c7'; roundRect(c,-topW/2-7,ty,topW+14,7,4,true,false);
  // handle
  c.strokeStyle='#cdd8dc'; c.lineWidth=5; c.beginPath(); c.arc(0,ty-1,15,Math.PI*1.06,Math.PI*1.94); c.stroke();
  // glowing smash sparkle emblem
  c.save(); c.translate(0,12); c.fillStyle='#3bd66b'; c.shadowBlur=16; c.shadowColor='#3bd66b';
  c.beginPath(); for(let i=0;i<8;i++){ const a=i*Math.PI/4, r=i%2?5:14; c.lineTo(Math.cos(a)*r,Math.sin(a)*r); } c.closePath(); c.fill();
  c.restore(); c.shadowBlur=0;
  c.restore();
}
function dust(g,x,y,color,n=7){ for(let i=0;i<n;i++) g.particles.push(new Particle(x+rand(-15,15),y+rand(-4,4),rand(-120,120),rand(-120,-20),rand(.18,.35),rand(3,8),color)); }
function ring(g,x,y,color){ g.particles.push(new Particle(x,y,0,0,.35,38,color,'ring')); }
function sparks(g,x,y,color,dir,n=20){ for(let i=0;i<n;i++) g.particles.push(new Particle(x+rand(-18,18),y+rand(-20,20),dir*rand(80,460),rand(-280,220),rand(.18,.42),rand(3,8),color,i%2?'spark':'circle')); }

class Camera{
  constructor(){ this.x=0; this.y=0; this.z=1.8; this.shake=0; } // Starts zoomed in for a sleek opening transition
  update(dt,players){
    const alive=players.filter(p=>!p.dead); if(!alive.length) return;
    let minX=1e9,maxX=-1e9,minY=1e9,maxY=-1e9;
    for(const p of alive){ minX=Math.min(minX,p.x); maxX=Math.max(maxX,p.x); minY=Math.min(minY,p.y-110); maxY=Math.max(maxY,p.y+40); }
    const cx=(minX+maxX)/2, cy=(minY+maxY)/2-35, dist=Math.max(maxX-minX,maxY-minY);
    this.x=lerp(this.x,cx,1-Math.pow(.002,dt)); this.y=lerp(this.y,cy,1-Math.pow(.002,dt)); this.z=lerp(this.z,clamp(1.20-dist/1350,.66,1.12),1-Math.pow(.004,dt)); this.shake=Math.max(0,this.shake-dt*24);
  }
  add(v){ this.shake=Math.max(this.shake,v); }
  apply(c){ c.save(); c.translate(W/2+rand(-this.shake,this.shake),H/2+rand(-this.shake,this.shake)); c.scale(this.z,this.z); c.translate(-this.x,-this.y); }
}

class Player{
  constructor(id,char,x,y,human){
    Object.assign(this,{id,char,x,y,spawnX:x,spawnY:y,human,cpu:!human,vx:0,vy:0,face:id===1?1:-1,stocks:3,damage:0,dead:false,respawn:0,invincible:1.3,ground:false,jumps:1,coyote:0,jumpHeld:false,hitstun:0,attack:null,atkT:0,atkHit:false,shield:0,dodge:0,drop:0,lag:0,fastFall:false,anim:0,aiT:0,aiDir:0,aiJump:false,aiAtk:false,aiSpec:false,ledge:null,ledgeCD:0,ledgeT:0,airDodge:false,airDodgeT:0,recoverDrift:1,recoverT:0});
    this.w=42*char.scale; this.h=82*char.scale;
  }
  hurtbox(){ return {x:this.x-this.w/2,y:this.y-this.h,w:this.w,h:this.h}; }
  controls(){
    if(this.id===1) return {left:keys.KeyA,right:keys.KeyD,down:keys.KeyS,up:keys.KeyW,jump:keys.KeyW,attack:pressed.KeyJ||pressed.KeyU||pressed.KeyI||pressed.KeyO,special:pressed.KeyK,shield:keys.KeyL||pressed.KeyL,u:pressed.KeyU,f:pressed.KeyI,d:pressed.KeyO,n:pressed.KeyJ};
    return {left:keys.ArrowLeft,right:keys.ArrowRight,down:keys.ArrowDown,up:keys.ArrowUp,jump:keys.ArrowUp,attack:pressed.Numpad1||pressed.Digit1,special:pressed.Numpad2||pressed.Digit2,shield:keys.Numpad3||keys.Digit3||pressed.Numpad3||pressed.Digit3,u:false,f:false,d:false,n:true};
  }
  aiControl(dt,g,op){
    this.aiT-=dt;
    if(this.aiT<=0){
      const dx=op.x-this.x, dy=op.y-this.y; this.aiT=rand(.07,.17); this.aiDir=Math.abs(dx)>35?Math.sign(dx):0; this.aiJump=false; this.aiAtk=false; this.aiSpec=false;
      if(this.y>op.y+65||this.y>260) this.aiJump=Math.random()<.75;
      if(Math.abs(dx)<95&&Math.abs(dy)<95) this.aiAtk=Math.random()<.75;
      if(Math.abs(dx)>105&&Math.abs(dx)<360) this.aiSpec=Math.random()<.22;
      if(this.x<g.stage.bounds.l+220) this.aiDir=1; if(this.x>g.stage.bounds.r-220) this.aiDir=-1;
    }
    const recover=this.y>250||this.x<g.stage.bounds.l+160||this.x>g.stage.bounds.r-160;
    return {left:this.aiDir<0,right:this.aiDir>0,down:false,up:recover||this.aiJump,jump:recover||this.aiJump,attack:this.aiAtk,special:this.aiSpec||recover&&Math.random()<.08,shield:Math.random()<.002,u:false,f:false,d:false,n:true};
  }
  choose(c,special){
    const air=!this.ground;
    if(special){ if(c.up) return 'uspec'; if(c.down) return 'dspec'; if(c.left||c.right) return 'sspec'; return 'nspec'; }
    if(c.u||c.up) return air?'uair':'utilt'; if(c.d||c.down) return air?'dair':'dtilt'; if(c.f||c.left||c.right) return air?'fair':'ftilt'; return air?'nair':'jab';
  }
  startAttack(kind,g,c){
    if(this.attack||this.hitstun>0||this.lag>0||this.dodge>0||this.dead||this.ledge) return;
    const a=this.char.moves[kind]; this.attack=a; this.atkT=0; this.atkHit=false; audio.play(a.special?'special':'dash');
    if(a.dash){ this.vx=this.face*a.dash; dust(g,this.x-this.face*25,this.y-5,this.char.color,10); }
    if(a.warp){ // teleport blink recovery (Sable)
      const dx=c?((c.right?1:0)-(c.left?1:0)):0, dy=c?((c.down?1:0)-(c.up?1:0)):0;
      let hx=dx||this.face, hy=dy?dy:-0.85; const len=Math.hypot(hx,hy)||1;
      sparks(g,this.x,this.y-this.h*.5,this.char.accent,this.face,16);
      this.x+=hx/len*a.warp; this.y+=hy/len*a.warp*.85; this.vx=hx/len*200; this.vy=-Math.abs(a.lift); this.ground=false; this.jumps=1; this.airDodge=false; this.invincible=Math.max(this.invincible,.24);
      sparks(g,this.x,this.y-this.h*.5,this.char.accent,this.face,16); ring(g,this.x,this.y-45,this.char.accent);
    } else if(a.lift){ this.vy=-a.lift; this.ground=false; this.jumps=0; this.recoverDrift=a.drift||1; this.recoverT=.55; ring(g,this.x,this.y-45,this.char.accent); }
    if(a.projectile) g.projectiles.push(new Projectile(this,this.x+this.face*55,this.y-48,this.face*650,-30,this.char.accent));
  }
  box(){
    const a=this.attack; if(!a) return null;
    if(['nair'].includes(a.kind)) return {x:this.x-a.w/2,y:this.y-this.h*.64-a.h/2,w:a.w,h:a.h};
    if(['utilt','uair','uspec'].includes(a.kind)) return {x:this.x-a.w/2,y:this.y-a.h-50,w:a.w,h:a.h};
    if(['dtilt','dair','dspec'].includes(a.kind)) return {x:this.x+(a.kind==='dspec'?-a.w/2:this.face*a.ox-(this.face<0?a.w:0)),y:this.y+a.oy,w:a.w,h:a.h};
    return {x:this.x+(this.face>0?a.ox:-a.ox-a.w),y:this.y+a.oy,w:a.w,h:a.h};
  }
  update(dt,g,op){
    this.anim+=dt; if(this.dead){ this.respawn-=dt; if(this.respawn<=0&&this.stocks>0){ this.dead=false; this.x=this.spawnX; this.y=this.spawnY; this.vx=this.vy=0; this.damage=0; this.invincible=1.8; this.ledge=null; this.airDodge=false; ring(g,this.x,this.y-50,this.char.accent); } return; }
    this.invincible=Math.max(0,this.invincible-dt); this.drop=Math.max(0,this.drop-dt); this.dodge=Math.max(0,this.dodge-dt); this.shield=Math.max(0,this.shield-dt); this.lag=Math.max(0,this.lag-dt); this.ledgeCD=Math.max(0,this.ledgeCD-dt); this.airDodgeT=Math.max(0,this.airDodgeT-dt); this.recoverT=Math.max(0,this.recoverT-dt); this.coyote=this.ground?.095:Math.max(0,this.coyote-dt);

      if(dir&&this.lag<=0&&this.dodge<=0&&!ad){ this.face=dir; this.vx+=dir*(this.ground?this.char.speed*7:this.char.air*(this.recoverT>0?this.recoverDrift:1))*dt; this.vx=clamp(this.vx,-this.char.speed,this.char.speed); if(this.ground&&Math.random()<dt*10) dust(g,this.x-dir*20,this.y,this.char.color,2); }
      else if(this.ground&&!this.attack){ const f=2100*dt; this.vx=Math.abs(this.vx)<f?0:this.vx-Math.sign(this.vx)*f; }
      if(c.down&&!this.ground&&!ad){ this.fastFall=true; this.vy=Math.max(this.vy,420); }
      if(c.down&&this.ground&&((this.id===1&&pressed.KeyS)||(this.id===2&&pressed.ArrowDown))) this.drop=.16;
      if(c.jump&&!this.jumpHeld&&!ad){ if(this.ground||this.coyote>0){ this.vy=-this.char.jump; this.ground=false; this.coyote=0; this.jumps=1; audio.play('jump'); dust(g,this.x,this.y,this.char.color,8); } else if(this.jumps>0){ this.vy=-this.char.jump*.92; this.jumps=0; audio.play('jump'); ring(g,this.x,this.y-48,this.char.color); } }
      if(!c.jump&&this.vy<0) this.vy+=this.char.fall*.65*dt; this.jumpHeld=c.jump;
      if(!ad){ if(c.attack) this.startAttack(this.choose(c,false),g,c); if(c.special) this.startAttack(this.choose(c,true),g,c); }
    }
    if(this.attack){
      this.atkT+=dt; const a=this.attack;
      if(this.atkT>=a.startup&&this.atkT<=a.startup+a.active&&!this.atkHit&&!a.projectile){ const b=this.box(); if(op&&!op.dead&&op.invincible<=0&&hitRect(b,op.hurtbox())){ this.atkHit=true; op.takeHit(this,a.damage,a.kb,a.angle,g,false); sparks(g,op.x,op.y-op.h*.55,a.color,this.face,18+a.damage); g.cam.add(a.damage>=12?8:4); audio.play(a.damage>=13?'heavy':'hit'); } }
      if(this.atkT>a.startup+a.active+a.recovery){ if(!this.ground) this.lag=.04; this.attack=null; }
    }
    if(this.airDodgeT>0){ this.vx*=Math.pow(.05,dt); this.vy*=Math.pow(.05,dt); }
    else { this.vy+=this.char.fall*dt+(this.fastFall?this.char.fall*.45*dt:0); this.vy=clamp(this.vy,-1350, this.char.fall*.78+(this.fastFall?320:0)); }
    const oy=this.y; this.x+=this.vx*dt; this.y+=this.vy*dt; this.collide(oy,g);
    if(!this.ground&&this.ledgeCD<=0&&this.hitstun<=0&&!this.attack&&this.airDodgeT<=0) this.tryLedge(g,c);
    const b=g.stage.bounds; if(this.x<b.l||this.x>b.r||this.y<b.t||this.y>b.b) this.loseStock(g);
  }
  collide(oy,g){

    for(const p of g.stage.platforms){
      if(this.x+this.w/2>p.x&&this.x-this.w/2<p.x+p.w&&oy<=p.y+8&&this.y>=p.y&&this.y<=p.y+p.h+22&&this.vy>=0&&this.drop<=0){

  }

    this.x=side<0?p.x-18:p.x+p.w+18; this.y=p.y+60; this.face=side<0?1:-1;

  }
  hang(dt,g,c){
    this.vx=0; this.vy=0; this.ledgeT+=dt; const p=this.ledge.p, side=this.ledge.side;
    const toward=side<0?c.right:c.left, away=side<0?c.left:c.right;
    if((c.jump&&!this.jumpHeld)||toward){ // climb up onto the stage
      this.ledge=null; this.x=side<0?p.x+34:p.x+p.w-34; this.y=p.y; this.ground=true; this.jumps=1; this.ledgeCD=.25; this.invincible=Math.max(this.invincible,.25); audio.play('jump'); dust(g,this.x,this.y,this.char.color,8);

  }

function drawFighter(c, p, x, y) {
  const ch = p.char, s = ch.scale, f = p.face, t = p.anim;
  const isGrounded = p.ground;
  const isMoving = isGrounded && Math.abs(p.vx) > 50;
  const isAttacking = p.attack !== null;

  // Procedural Animation Cycles
  const speed = isMoving ? 16 : 4;
  const cycle = t * speed;
  const breath = Math.sin(t * 5) * (isMoving ? 3 : 1);
  const swing = isMoving ? Math.sin(cycle) : 0;
  
  // Blend between grounded running and aerial poses (-1 = rising, 1 = falling)
  const airBlend = isGrounded ? 0 : clamp(p.vy / 800, -1, 1);

  c.save();
  c.translate(x, y + breath * s);
  c.scale(f, 1); // Flip based on facing direction

  // Global Drop Shadow
  c.fillStyle = 'rgba(0,0,0,0.5)';
  c.beginPath(); 
  c.ellipse(0, 5 - breath * s, 28 * s, 7 * s, 0, 0, Math.PI * 2); 
  c.fill();

  c.scale(s, s); // Apply character size scaling

  // Limb drawing utility
  const drawLimb = (lx, ly, w, h, ang, color, detailColor) => {
    c.save(); c.translate(lx, ly); c.rotate(ang);
    c.fillStyle = color; roundRect(c, -w/2, 0, w, h, w/3, true, false);
    if (detailColor) {
      c.fillStyle = detailColor;
      c.fillRect(-w/2 + 2, h - 12, w - 4, 8); // Armor cuffs/boots
    }
    c.restore();
  };

  // --- Dynamic Posture Calculation ---
  let backLegAng = isGrounded ? swing * 0.7 : 0.3 + airBlend * 0.4;
  let frontLegAng = isGrounded ? -swing * 0.7 : -0.2 + airBlend * 0.2;
  
  let backArmAng = isGrounded ? -swing * 0.9 : -2.5 - airBlend;
  let frontArmAng = isGrounded ? swing * 0.9 : -2.8 - airBlend;
  let armLength = 32;

  // Attack Override: Thrust the front arm forward
  if (isAttacking) {
    const atkProgress = p.atkT / (p.attack.startup + p.attack.active + p.attack.recovery);
    if (atkProgress > 0.1 && atkProgress < 0.7) {
      frontArmAng = -Math.PI / 2 + (p.attack.angle || 0) * 0.5; // Aim toward attack angle
      armLength = 45; // Stretch arm
    }
  }

  // Define Palettes
  const cMain = ch.color, cDark = ch.dark, cAcc = ch.accent;

  // --- 1. BACK LIMBS ---
  drawLimb(2, -38, 12, 38, backLegAng, cDark); // Back Leg
  drawLimb(0, -62, 10, 32, backArmAng, cDark); // Back Arm

  // --- 2. TORSO ---
  c.fillStyle = cMain;
  c.beginPath();
  // Sleek, angular torso geometry
  if (ch.id === 'bront') {
    c.moveTo(-22, -68); c.lineTo(22, -68); // Broad shoulders
    c.lineTo(14, -35); c.lineTo(-14, -35);
  } else if (ch.id === 'lyra') {
    c.moveTo(-10, -62); c.lineTo(16, -62); // Leaning forward
    c.lineTo(8, -38); c.lineTo(-8, -38);
  } else {
    c.moveTo(-16, -66); c.lineTo(16, -66); // Standard V-taper
    c.lineTo(10, -36); c.lineTo(-10, -36);
  }
  c.fill();

  // Torso Armor Detailing
  c.fillStyle = cDark;
  c.beginPath(); c.moveTo(-8, -66); c.lineTo(8, -66); c.lineTo(0, -45); c.fill();
  
  // Glowing chest core
  c.shadowBlur = 12; c.shadowColor = cAcc;
  c.fillStyle = cAcc;
  c.beginPath(); c.arc(0, -56, 4, 0, Math.PI * 2); c.fill();
  c.shadowBlur = 0;

  // --- 3. HEAD & HELMET ---
  c.save();
  c.translate(0, -68);
  c.rotate(isMoving ? 0.15 : 0); // Slight forward head tilt when running
  
  c.fillStyle = cDark;
  roundRect(c, -12, -22, 24, 24, 8, true, false); // Base Helmet
  
  c.fillStyle = cMain;
  if (ch.id === 'sable') {
    c.beginPath(); c.moveTo(-18, -24); c.lineTo(18, -16); c.lineTo(0, 4); c.fill(); // Mage hood
  } else {
    roundRect(c, -10, -24, 20, 14, 6, true, false); // Standard crown
  }

  // Glowing Visor
  c.shadowBlur = 15; c.shadowColor = cAcc;
  c.fillStyle = cAcc;
  if (ch.id === 'bront') {
    c.fillRect(4, -14, 6, 6); // Single cyclops eye
  } else {
    roundRect(c, 0, -14, 12, 5, 2, true, false); // Sleek visor
  }
  c.restore();
  c.shadowBlur = 0;

  // --- 4. FRONT LIMBS ---
  // Unique shoulder pads
  c.fillStyle = cMain;
  if (ch.id === 'bront') roundRect(c, -8, -72, 18, 16, 6, true, false);
  
  drawLimb(-2, -38, 14, 40, frontLegAng, cMain, cAcc); // Front Leg
  drawLimb(0, -62, 12, armLength, frontArmAng, cMain, cAcc); // Front Arm

  // Character-specific floating VFX
  if (ch.id === 'sable') {
    c.shadowBlur = 10; c.shadowColor = cAcc;
    c.strokeStyle = cAcc; c.lineWidth = 2;
    const floatY = Math.sin(t * 3) * 5;
    c.beginPath(); c.arc(-25, -50 + floatY, 6, 0, Math.PI * 2); c.stroke();
    c.beginPath(); c.arc(25, -60 - floatY, 4, 0, Math.PI * 2); c.stroke();
  }

  c.restore();
}

class Button{
  constructor(text,x,y,w,h,fn){ Object.assign(this,{text,x,y,w,h,fn}); }
  inside(){ return mouse.x>=this.x&&mouse.x<=this.x+this.w&&mouse.y>=this.y&&mouse.y<=this.y+this.h; }
  draw(c,sel){ 
    const h=this.inside()||sel; 
    c.save(); 
    c.shadowBlur=h?24:0; 
    c.shadowColor='#a855f7'; 
    const g=c.createLinearGradient(this.x,this.y,this.x,this.y+this.h); 
    g.addColorStop(0,h?'#a855f7':'#1e1b4b'); 
    g.addColorStop(1,h?'#3b82f6':'#000000'); 
    c.fillStyle=g; 
    roundRect(c,this.x,this.y,this.w,this.h,12,true,false); 
    c.strokeStyle=h?'#fff':'rgba(255,255,255,.2)'; 
    c.lineWidth=2; 
    roundRect(c,this.x,this.y,this.w,this.h,12,false,true); 
    c.fillStyle='#fff'; 
    c.textAlign='center'; 
    c.textBaseline='middle'; 
    c.font='900 24px "Franklin Gothic Medium", sans-serif'; 
    c.fillText(this.text,this.x+this.w/2,this.y+this.h/2+2); 
    c.restore(); 
  }
}

class Game{
  constructor(){ this.state='title'; this.lastState='title'; this.stateTimer=0; this.buttons=[]; this.menu=0; this.time=0; this.p1=0; this.p2=1; this.cpu=true; this.stageI=0; this.players=[]; this.stage=stages[0]; this.cam=new Camera(); this.particles=[]; this.projectiles=[]; this.winner=null; this.pause=0; this.last=performance.now(); this.makeButtons(); requestAnimationFrame(this.loop.bind(this)); }
  makeButtons(){ this.buttons=[]; if(this.state==='title') this.buttons=[new Button('PRESS ENTER / CLICK',W/2-210,H*.68,420,60,()=>{this.state='main';this.makeButtons();audio.play('select');})];
    else if(this.state==='main') this.buttons=[new Button('PLAY',W/2-140,H*.38,280,58,()=>{this.state='char';this.makeButtons();audio.play('select');}),new Button('CONTROLS',W/2-140,H*.49,280,58,()=>{this.state='controls';this.makeButtons();audio.play('select');}),new Button('CREDITS',W/2-140,H*.60,280,58,()=>{this.state='credits';this.makeButtons();audio.play('select');})];
    else if(this.state==='char') this.buttons=[new Button(this.cpu?'P2: CPU':'P2: HUMAN',W/2-130,H-120,260,46,()=>{this.cpu=!this.cpu;this.makeButtons();audio.play('select');}),new Button('CONTINUE',W/2-130,H-66,260,46,()=>{this.state='stage';this.makeButtons();audio.play('select');})];
    else if(this.state==='stage') this.buttons=[new Button('START MATCH',W/2-155,H-72,310,54,()=>this.start())];
    else if(this.state==='over') this.buttons=[new Button('REMATCH',W/2-300,H-90,260,54,()=>this.start()),new Button('CHARACTER SELECT',W/2+40,H-90,260,54,()=>{this.state='char';this.makeButtons();})]; }
  start(){ this.stage=stages[this.stageI]; this.players=[new Player(1,characters[this.p1],-170,-80,true),new Player(2,characters[this.p2],170,-80,!this.cpu)]; this.players[1].cpu=this.cpu; this.cam=new Camera(); this.particles=[]; this.projectiles=[]; this.winner=null; this.state='match'; audio.play('select'); }
  endCheck(){ const alive=this.players.filter(p=>p.stocks>0); if(alive.length===1){ this.winner=alive[0]; this.state='over'; this.makeButtons(); audio.play('victory'); } }
  loop(now){ const dt=clamp((now-this.last)/1000,0,1/30); this.last=now; this.time+=dt; audio.update(dt); this.update(dt); this.draw(); mouse.click=false; for(const k in pressed) delete pressed[k]; requestAnimationFrame(this.loop.bind(this)); }
  update(dt){
    if (this.state !== this.lastState) { this.stateTimer = 0; this.lastState = this.state; }
    this.stateTimer += dt;
    
    if(pressed.KeyM) audio.toggle();
    if(['title','main','controls','credits','char','stage','over'].includes(this.state)){ this.menuInput(); if(pressed.Escape){ this.state=this.state==='main'?'title':'main'; this.makeButtons(); audio.play('select'); } }
    if(this.state==='char'){ if(pressed.KeyA){this.p1=(this.p1+3)%4;audio.play('select');} if(pressed.KeyD){this.p1=(this.p1+1)%4;audio.play('select');} if(pressed.ArrowLeft){this.p2=(this.p2+3)%4;audio.play('select');} if(pressed.ArrowRight){this.p2=(this.p2+1)%4;audio.play('select');} if(pressed.KeyC){this.cpu=!this.cpu;this.makeButtons();audio.play('select');} if(pressed.Enter){this.state='stage';this.makeButtons();} }
    if(this.state==='stage'){ if(pressed.KeyA||pressed.ArrowLeft){this.stageI=(this.stageI+stages.length-1)%stages.length;audio.play('select');} if(pressed.KeyD||pressed.ArrowRight){this.stageI=(this.stageI+1)%stages.length;audio.play('select');} if(pressed.Enter) this.start(); }
    if(this.state==='match'){ if(pressed.Escape){this.state='pause'; return;} if(pressed.KeyR) this.start(); const [a,b]=this.players; a.update(dt,this,b); b.update(dt,this,a); this.cam.update(dt,this.players); this.projectiles.forEach(p=>p.update(dt,this)); this.projectiles=this.projectiles.filter(p=>p.life>0&&!p.hit); this.particles.forEach(p=>p.update(dt)); this.particles=this.particles.filter(p=>p.life>0); }
    if(this.state==='pause'){ if(pressed.Escape) this.state='match'; if(pressed.KeyR) this.start(); if(pressed.ArrowDown||pressed.KeyS){this.pause=(this.pause+1)%3;audio.play('select');} if(pressed.ArrowUp||pressed.KeyW){this.pause=(this.pause+2)%3;audio.play('select');} if(pressed.Enter){ if(this.pause===0)this.state='match'; if(this.pause===1)this.start(); if(this.pause===2){this.state='main';this.makeButtons();} } }
  }
  menuInput(){ if(mouse.click) for(const b of this.buttons) if(b.inside()){ b.fn(); return; } if(pressed.ArrowDown||pressed.KeyS){this.menu=(this.menu+1)%Math.max(1,this.buttons.length);audio.play('select');} if(pressed.ArrowUp||pressed.KeyW){this.menu=(this.menu+Math.max(1,this.buttons.length)-1)%Math.max(1,this.buttons.length);audio.play('select');} if(pressed.Enter&&this.buttons.length) this.buttons[this.menu%this.buttons.length].fn(); }
  bg(){ const g=ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,'#000000'); g.addColorStop(.5,'#09090b'); g.addColorStop(1,'#050211'); ctx.fillStyle=g; ctx.fillRect(0,0,W,H); ctx.save(); ctx.globalCompositeOperation='lighter'; for(let i=0;i<55;i++){ ctx.globalAlpha=.10+.10*Math.sin(this.time*2+i); ctx.fillStyle=i%3?'#a855f7':'#3b82f6'; ctx.beginPath(); ctx.arc((i*137+this.time*25)%W,(i*83+Math.sin(this.time+i)*25+H)%H,2+i%5,0,6.28); ctx.fill(); } ctx.restore(); }
  draw(){ ctx.clearRect(0,0,W,H); if(this.state==='match'||this.state==='pause'){ this.drawMatch(); if(this.state==='pause') this.drawPause(); } else { this.bg(); if(this.state==='title') this.drawTitle(); if(this.state==='main') this.drawMain(); if(this.state==='controls') this.drawControls(); if(this.state==='credits') this.drawCredits(); if(this.state==='char') this.drawChar(); if(this.state==='stage') this.drawStageSelect(); if(this.state==='over') this.drawOver(); this.buttons.forEach((b,i)=>b.draw(ctx,i===this.menu)); } 
    // Smooth transition fade
    if(this.stateTimer < 0.2) { ctx.fillStyle=`rgba(0,0,0,${1 - this.stateTimer / 0.2})`; ctx.fillRect(0,0,W,H); }
  }
  drawTitle(){ drawTrashCan(ctx,W/2,H*.165,1.1,this.time); ctx.textAlign='center'; ctx.fillStyle='#fff'; ctx.shadowColor='#3bd66b'; ctx.shadowBlur=34; ctx.font='900 78px "Franklin Gothic Medium", sans-serif'; ctx.fillText('SUPER SMASH',W/2,H*.42); ctx.shadowColor='#7ee8ff'; ctx.fillText('TRASH',W/2,H*.42+74); ctx.shadowBlur=0; ctx.font='700 20px "Franklin Gothic Medium", sans-serif'; ctx.fillStyle='rgba(255,255,255,.8)'; ctx.fillText('Take out the trash. Last bin standing wins.',W/2,H*.42+114); }
  drawMain(){ drawTrashCan(ctx,W/2,H*.085,.6,this.time); ctx.textAlign='center'; ctx.fillStyle='#fff'; ctx.font='900 54px "Franklin Gothic Medium", sans-serif'; ctx.shadowColor='#3bd66b'; ctx.shadowBlur=24; ctx.fillText('SUPER SMASH TRASH',W/2,H*.21); ctx.shadowBlur=0; ctx.font='600 18px "Franklin Gothic Medium", sans-serif'; ctx.fillStyle='rgba(255,255,255,.72)'; ctx.fillText('Knock the garbage past the blast zone. Three stocks. One bin.',W/2,H*.27); }
  drawControls(){ ctx.textAlign='center'; ctx.fillStyle='#fff'; ctx.font='900 42px "Franklin Gothic Medium", sans-serif'; ctx.fillText('CONTROLS',W/2,95); ctx.font='700 18px "Franklin Gothic Medium", sans-serif'; const lines=['P1: A/D move, W jump, S fast fall, J attack, K special, L dodge','P1 shortcuts: U up attack, I forward attack, O down attack','P2: Arrow keys, Numpad 1 attack, Numpad 2 special, Numpad 3 dodge','Enter select, Escape pause/back, R restart, M mute','In the air, the dodge button air-dodges any direction — once per jump.','Recovery: double jump, Up-special (each fighter is unique), or air-dodge to stage.','Drift into a ledge to grab it. Up / toward = climb, Attack = get-up, Down / away = drop.']; lines.forEach((l,i)=>ctx.fillText(l,W/2,150+i*42)); }
  drawCredits(){ ctx.textAlign='center'; ctx.fillStyle='#fff'; ctx.font='900 42px "Franklin Gothic Medium", sans-serif'; ctx.fillText('CREDITS',W/2,115); ctx.font='700 21px "Franklin Gothic Medium", sans-serif'; ctx.fillStyle='rgba(255,255,255,.86)'; ctx.fillText('All characters, stages, sounds, music, UI, effects, and branding are original procedural content.',W/2,195); ctx.fillText('Built with HTML, CSS, JavaScript, Canvas API, and Web Audio API.',W/2,240); }
  drawChar(){ ctx.textAlign='center'; ctx.fillStyle='#fff'; ctx.font='900 42px "Franklin Gothic Medium", sans-serif'; ctx.fillText('CHARACTER SELECT',W/2,66); ctx.font='700 16px "Franklin Gothic Medium", sans-serif'; ctx.fillStyle='rgba(255,255,255,.75)'; ctx.fillText('P1 uses A/D. P2 uses Left/Right. Press C or click to toggle CPU.',W/2,96); const cw=Math.min(230,W/5.4), ch=300, sx=W/2-cw*2-24; characters.forEach((chara,i)=>{ const x=sx+i*(cw+16),y=145, p1=i===this.p1, p2=i===this.p2; ctx.save(); const gr=ctx.createLinearGradient(x,y,x,y+ch); gr.addColorStop(0,chara.dark); gr.addColorStop(1,'#04060d'); ctx.fillStyle=gr; ctx.shadowColor=p1||p2?chara.color:'#000'; ctx.shadowBlur=p1||p2?20:0; roundRect(ctx,x,y,cw,ch,12,true,false); ctx.strokeStyle=p1&&p2?'#fff':p1?'#42e8ff':p2?'#ffdf6d':'rgba(255,255,255,.1)'; ctx.lineWidth=p1||p2?4:2; roundRect(ctx,x,y,cw,ch,12,false,true); const fake=new Player(1,chara,x+cw/2,y+210,true); fake.anim=this.time; fake.ground=true; fake.vx=i%2?120:0; drawFighter(ctx,fake,x+cw/2,y+210); ctx.fillStyle='#fff'; ctx.font='900 21px "Franklin Gothic Medium", sans-serif'; ctx.fillText(chara.name,x+cw/2,y+36); ctx.font='800 15px "Franklin Gothic Medium", sans-serif'; ctx.fillStyle=chara.accent; ctx.fillText(chara.role,x+cw/2,y+60); ctx.font='600 12px "Franklin Gothic Medium", sans-serif'; ctx.fillStyle='rgba(255,255,255,.72)'; wrap(ctx,chara.desc,x+cw/2,y+84,cw-26,16); ctx.font='900 15px "Franklin Gothic Medium", sans-serif'; if(p1){ctx.fillStyle='#42e8ff';ctx.fillText('P1',x+32,y+ch-22);} if(p2){ctx.fillStyle='#ffdf6d';ctx.fillText(this.cpu?'CPU':'P2',x+cw-35,y+ch-22);} ctx.restore(); }); }
  drawStageSelect(){ ctx.textAlign='center'; ctx.fillStyle='#fff'; ctx.font='900 42px "Franklin Gothic Medium", sans-serif'; ctx.fillText('STAGE SELECT',W/2,72); const st=stages[this.stageI], sw=Math.min(660,W*.68), sh=330, x=W/2-sw/2,y=155; ctx.save(); roundRect(ctx,x,y,sw,sh,16,true,false); ctx.clip(); ctx.translate(x+sw/2,y+sh/2+45); ctx.scale(.34,.34); this.drawStageWorld(st, null); ctx.restore(); ctx.strokeStyle=st.accent; ctx.lineWidth=5; roundRect(ctx,x,y,sw,sh,16,false,true); ctx.fillStyle='#fff'; ctx.font='900 34px "Franklin Gothic Medium", sans-serif'; ctx.fillText(st.name,W/2,y+sh+52); ctx.fillStyle='rgba(255,255,255,.75)'; ctx.font='700 17px "Franklin Gothic Medium", sans-serif'; ctx.fillText(st.desc,W/2,y+sh+83); }
  drawOver(){ ctx.textAlign='center'; ctx.fillStyle='#fff'; ctx.font='900 52px "Franklin Gothic Medium", sans-serif'; ctx.fillText('VICTORY',W/2,92); if(this.winner){ ctx.fillStyle=this.winner.char.accent; ctx.font='900 34px "Franklin Gothic Medium", sans-serif'; ctx.fillText('PLAYER '+this.winner.id+' WINS',W/2,142); const fake=new Player(this.winner.id,this.winner.char,W/2,405,true); fake.anim=this.time; fake.ground=true; drawFighter(ctx,fake,W/2,420); ctx.fillStyle='#fff'; ctx.font='900 32px "Franklin Gothic Medium", sans-serif'; ctx.fillText(this.winner.char.name,W/2,235); } }
  
  drawStageWorld(st, cam){ 
    const px = cam ? cam.x : 0;
    const py = cam ? cam.y : 0;
    
    // Deep Parallax Background
    ctx.save();
    const g=ctx.createLinearGradient(0,-800,0,650); 
    g.addColorStop(0,st.bg[0]); g.addColorStop(1,st.bg[1]); 
    ctx.fillStyle=g; 
    ctx.translate(px * 0.8, py * 0.6);
    ctx.fillRect(-3000,-2000,6000,4000); 
    ctx.restore();
    
    // Mid Parallax Layer
    ctx.save(); 
    ctx.translate(px * 0.4, py * 0.2);
    ctx.globalAlpha=.28; ctx.globalCompositeOperation='lighter'; 
    for(let i=-12;i<=12;i++){ 
      ctx.fillStyle=st.accent; 
      if(st.name.includes('Neon')) ctx.fillRect(i*180+Math.sin(i)*40,-380+(i*i%8)*55,80,880); 
      else { ctx.beginPath(); ctx.arc(i*220+Math.sin(this.time+i)*30,-380+Math.cos(i)*70,55+(i%4)*14,0,6.28); ctx.fill(); } 
    } 
    ctx.restore(); 
    
    // Global Stage Illumination Glow
    ctx.save();
    ctx.globalCompositeOperation='lighter';
    const glow = ctx.createRadialGradient(0, 0, 100, 0, 0, 900);
    glow.addColorStop(0, st.accent + '33');
    glow.addColorStop(1, 'transparent');
    ctx.fillStyle = glow;
    ctx.fillRect(-1500, -800, 3000, 1600);
    ctx.restore();

    // Foreground Stage Platforms
    st.platforms.forEach(p=>{ 
      const gr=ctx.createLinearGradient(p.x,p.y,p.x,p.y+p.h); 
      gr.addColorStop(0,st.accent); gr.addColorStop(1,p.main?'#09090b':'rgba(255,255,255,.1)'); 
      ctx.fillStyle=gr; roundRect(ctx,p.x,p.y,p.w,p.h,8,true,false); 
      ctx.strokeStyle='rgba(255,255,255,.5)'; ctx.lineWidth=2; roundRect(ctx,p.x,p.y,p.w,p.h,8,false,true); 
    }); 
  }
  
  drawMatch(){ this.cam.apply(ctx); this.drawStageWorld(this.stage, this.cam); this.projectiles.forEach(p=>p.draw(ctx)); this.particles.forEach(p=>p.draw(ctx)); this.players.forEach(p=>p.draw(ctx)); ctx.restore(); this.hud(); }
  hud(){ 
    const draw=(p,x)=>{ 
      ctx.save(); 
      ctx.fillStyle='#000000'; ctx.globalAlpha=0.85;
      roundRect(ctx,x,H-112,350,88,12,true,false); ctx.globalAlpha=1;
      ctx.strokeStyle=p.char.color; ctx.lineWidth=3; 
      roundRect(ctx,x,H-112,350,88,12,false,true); 
      
      ctx.textAlign='left'; ctx.fillStyle='#fff'; ctx.font='900 20px "Franklin Gothic Medium", sans-serif'; 
      ctx.fillText((p.cpu?'CPU ':'P'+p.id+' ')+p.char.name,x+82,H-84); 
      
      ctx.font='900 36px "Franklin Gothic Medium", sans-serif'; 
      ctx.fillStyle=p.damage>120?'#ef4444':p.damage>70?'#f59e0b':'#fff'; 
      ctx.shadowBlur = 12; ctx.shadowColor = ctx.fillStyle;
      ctx.fillText(Math.floor(p.damage)+'%',x+82,H-44); 
      ctx.shadowBlur = 0;
      
      for(let i=0;i<3;i++){ 
        ctx.globalAlpha=i<p.stocks?1:.2; ctx.fillStyle=p.char.accent; 
        ctx.shadowBlur = i<p.stocks?8:0; ctx.shadowColor = p.char.accent;
        ctx.beginPath(); ctx.arc(x+24+i*22,H-49,7,0,6.28); ctx.fill(); 
      } 
      ctx.globalAlpha=1; ctx.shadowBlur = 0;
      const f=new Player(p.id,p.char,x+42,H-35,true); f.anim=this.time; f.ground=true; 
      drawFighter(ctx,f,x+42,H-35); ctx.restore(); 
    }; 
    draw(this.players[0],32); draw(this.players[1],W-382); 
    ctx.textAlign='center'; ctx.fillStyle='rgba(255,255,255,.5)'; ctx.font='700 14px "Franklin Gothic Medium", sans-serif'; 
    ctx.fillText('Esc Pause  •  R Restart  •  M Mute'+(audio.muted?'  •  MUTED':''),W/2,30); 
  }
  drawPause(){ ctx.fillStyle='rgba(0,0,0,.75)'; ctx.fillRect(0,0,W,H); ctx.textAlign='center'; ctx.fillStyle='#fff'; ctx.font='900 56px "Franklin Gothic Medium", sans-serif'; ctx.fillText('PAUSED',W/2,H*.32); ['RESUME','RESTART','MAIN MENU'].forEach((o,i)=>{ ctx.fillStyle=i===this.pause?'#a855f7':'rgba(255,255,255,.85)'; ctx.font='900 28px "Franklin Gothic Medium", sans-serif'; ctx.fillText(o,W/2,H*.44+i*66); }); }
}
function wrap(c,text,x,y,max,lineH){ const words=text.split(' '); let line=''; for(const w of words){ const test=line+w+' '; if(c.measureText(test).width>max&&line){ c.fillText(line,x,y); line=w+' '; y+=lineH; } else line=test; } c.fillText(line,x,y); }
new Game();
</script>
